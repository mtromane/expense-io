name: perf

on:
  pull_request:
    types: [labeled, synchronize]
  # Une mesure par merge sur main : un point de courbe par étape de migration.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      mode:
        description: "ab = baseline contre version courante ; aa = baseline contre elle-même (mesure du bruit du runner)"
        type: choice
        options: [ab, aa]
        default: ab

concurrency:
  # PR : seule la dernière mesure compte. main : un groupe par commit, aucune
  # mesure annulée ni remplacée (chaque run a sa propre machine).
  group: perf-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  DATABASE_URL: postgres://expense:expense@localhost:5433/expense_io
  AUTH_SECRET: ci-main-instance-secret-0123456789abcdef
  AUTH_TRUST_HOST: 'true'
  S3_ENDPOINT: http://localhost:4567
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: test
  S3_SECRET_ACCESS_KEY: test
  S3_BUCKET: receipts
  S3_FORCE_PATH_STYLE: 'true'
  PERF_BASELINE_DIR: ../baseline
  # Le runner GitHub est plus bruyant que les machines locales : jusqu'à 15 %
  # d'écart observé entre deux versions au code identique (P-MGR, 21 ms, run
  # du 2026-10-12). Seuil relevé en CI ; à recalibrer avec le mode `aa`.
  PERF_REGRESSION_RATIO: '1.25'

jobs:
  perf:
    # Sur PR : seulement à la pose du label `perf`, ou à un nouveau commit d'une
    # PR qui le porte (poser un autre label ne relance rien).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'perf') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'perf'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: expense, POSTGRES_PASSWORD: expense, POSTGRES_DB: expense_io }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expense_io"
          --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env: { SERVICES: s3 }
        ports: ['4567:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && touch .env
      - run: npm run migrate:up && npm run ensure-bucket
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.54.0'
      - id: compare
        run: node tests/perf/compare.mjs ${{ inputs.mode == 'aa' && '--aa' || '' }}
      - if: always()
        run: cat perf-results/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results/
      - if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file perf-results/latest.md || true

  # Seul job avec un droit d'écriture sur le dépôt : il ne s'exécute qu'après
  # un merge sur main, jamais sur le code d'une PR.
  history:
    needs: perf
    if: always() && github.event_name == 'push' && needs.perf.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: perf-results
          path: perf-results
      - run: |
          test -f perf-results/history-line.jsonl || { echo "Pas de mesure à historiser."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin perf-history >/dev/null; then
            git fetch origin perf-history
            git worktree add -B perf-history ../perf-history origin/perf-history
          else
            git worktree add --orphan -b perf-history ../perf-history
          fi
          mkdir -p ../perf-history/docs/perf
          cat perf-results/history-line.jsonl >> ../perf-history/docs/perf/history.jsonl
          node tests/perf/trend.mjs ../perf-history/docs/perf/history.jsonl ../perf-history/docs/perf/trend.md
          cd ../perf-history
          git add docs/perf
          git commit -m "perf: mesure de ${GITHUB_SHA::7}"
          # Deux merges rapprochés peuvent pousser en même temps : on rejoue.
          for attempt in 1 2 3 4 5; do
            git push origin perf-history && exit 0
            git fetch origin perf-history
            git rebase origin/perf-history || {
              git rebase --abort
              git reset --hard origin/perf-history
              cat "$GITHUB_WORKSPACE/perf-results/history-line.jsonl" >> docs/perf/history.jsonl
              node "$GITHUB_WORKSPACE/tests/perf/trend.mjs" docs/perf/history.jsonl docs/perf/trend.md
              git add docs/perf
              git commit -m "perf: mesure de ${GITHUB_SHA::7}"
            }
            sleep $((attempt * 5))
          done
          echo "Échec du push de l'historique après 5 tentatives." >&2
          exit 1
